name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  samples-up-to-date:
    name: Generated samples match templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format
          pip install -e .
      - name: Regenerate samples against the Zephyr .clang-format
        run: |
          mkdir -p /tmp/zephyr
          curl -fsSL https://raw.githubusercontent.com/zephyrproject-rtos/zephyr/main/.clang-format \
            -o /tmp/zephyr/.clang-format
          ZEPHYR_BASE=/tmp/zephyr bash scripts/regen_samples.sh
      - name: Fail if committed samples are stale
        run: |
          git diff --exit-code -- samples/ || {
            echo "::error::samples/ are out of date; run scripts/regen_samples.sh and commit"; exit 1; }

  build-native-sim:
    name: Build samples for native_sim
    runs-on: ubuntu-latest
    container: ghcr.io/zephyrproject-rtos/ci:v0.27.4
    env:
      ZEPHYR_BASE: ${{ github.workspace }}/zephyrproject/zephyr
      ZEPHYR_SDK_INSTALL_DIR: /opt/toolchains/zephyr-sdk-0.17.0
    steps:
      - uses: actions/checkout@v4
        with:
          path: ble-gatt-generator

      - name: Initialise a minimal Zephyr workspace
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.1.0 zephyrproject
          cd zephyrproject
          west update --narrow -o=--depth=1 zephyr cmsis mbedtls hal_nordic
          pip install -r zephyr/scripts/requirements-base.txt

      - name: Install generator
        run: pip install -e ble-gatt-generator

      - name: Build all samples
        working-directory: ble-gatt-generator
        env:
          PYTHON_EXECUTABLE: python3
        run: bash scripts/ci.sh

  bsim-self-tests:
    name: BabbleSim self-tests (nrf52_bsim)
    runs-on: ubuntu-latest
    container: ghcr.io/zephyrproject-rtos/ci:v0.27.4
    env:
      ZEPHYR_BASE: ${{ github.workspace }}/zephyrproject/zephyr
      ZEPHYR_SDK_INSTALL_DIR: /opt/toolchains/zephyr-sdk-0.17.0
      BSIM_OUT_PATH: ${{ github.workspace }}/zephyrproject/tools/bsim
      BSIM_COMPONENTS_PATH: ${{ github.workspace }}/zephyrproject/tools/bsim/components
    steps:
      - uses: actions/checkout@v4
        with:
          path: ble-gatt-generator

      - name: Initialise a Zephyr workspace with BabbleSim
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.1.0 zephyrproject
          cd zephyrproject
          west config manifest.group-filter -- +babblesim
          west update --narrow -o=--depth=1
          pip install -r zephyr/scripts/requirements-base.txt

      - name: Build BabbleSim components
        run: make -C zephyrproject/tools/bsim everything -j$(nproc)

      - name: Install generator
        run: pip install -e ble-gatt-generator

      - name: Run generated self-tests
        working-directory: ble-gatt-generator
        run: bash scripts/test_bsim.sh
