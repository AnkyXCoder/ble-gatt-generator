# Minimal Kconfig for the gatt_gen_full profile.
# See KCONFIG_NOTES.md for why each symbol is required.
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="GATT Gen gatt_gen_full"
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
# (advisory) CONFIG_BT_FIXED_PASSKEY=y — Used by the generated BabbleSim test only — do NOT enable in production; a real device needs MITM-capable IO (display/keyboard) or OOB instead
# (advisory) CONFIG_BT_SMP_SC_ONLY=y — read_lesc/write_lesc permissions need LE Secure Connections pairing
# (advisory) CONFIG_BT_SIGNING=y — authenticated_signed_writes needs signing support; the app must also provision signing keys / bonded peer
CONFIG_BT_ATT_PREPARE_COUNT=2
CONFIG_BT_L2CAP_TX_MTU=68
# (advisory) CONFIG_BT_BUF_ACL_TX_SIZE=72 — ACL TX buffer must fit the L2CAP SDU + header
# (advisory) CONFIG_BT_BUF_ACL_RX_SIZE=72 — ACL RX buffer must fit the L2CAP SDU + header
# (advisory) CONFIG_BT_GATT_NOTIFY_MULTIPLE=y — Optional: batch notifications when several CCCs are enabled at once
CONFIG_LOG=y
CONFIG_BT_DEVICE_APPEARANCE=0
