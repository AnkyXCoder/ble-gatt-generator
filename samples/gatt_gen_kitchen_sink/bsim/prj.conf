# BabbleSim self-test: one binary plays both the peripheral running the
# generated GATT services and the central that verifies them.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_DEVICE_NAME="GATT Gen gatt_gen_full"
# Some characteristics require encryption/authentication.
CONFIG_BT_SMP=y
# Authenticated/LESC permissions need MITM pairing; a fixed passkey makes
# the pairing deterministic inside the simulation.
CONFIG_BT_FIXED_PASSKEY=y
CONFIG_BT_SMP_SC_ONLY=y
CONFIG_ASSERT=y
CONFIG_LOG=y
