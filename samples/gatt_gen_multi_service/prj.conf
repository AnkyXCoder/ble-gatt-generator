# Minimal Kconfig for the gatt_gen_multi profile.
# See KCONFIG_NOTES.md for why each symbol is required.
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="GATT Gen gatt_gen_multi"
CONFIG_BT_PERIPHERAL=y
